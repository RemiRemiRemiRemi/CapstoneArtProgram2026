<body> <!-- BODY IS VISUAL COMPONENTS -->







  
    <img src="/images/long_rectangle.png" alt="long :)" class="rectangle">

    <script>
    let drawingToggle = false;
    let erasingToggle = false;
    </script>

    <!--BUTTONS-->

    <button class="custom-button1" onclick="let el = document.getElementById('circle'); el.style.display = (el.style.display === 'none') ? 'block' : 'none';

    drawingToggle = !drawingToggle;
    erasingToggle = false;
    
    "></button>

    <img src="images/circle.png" alt="circle :)" class="circle" id="circle">

    <button class="custom-button2" onclick="let el = document.getElementById('circle'); el.style.display = 'none';

    drawingToggle = !drawingToggle;
    erasingToggle = drawingToggle;
    
    "></button>

    <button class="custom-button3" onclick="let el = document.getElementById('circle'); el.style.display = 'none'; drawingToggle = false;"></button>

    <button class="custom-button4" onclick="let el = document.getElementById('circle'); el.style.display = 'none'; drawingToggle = false;"></button>

    <button class="custom-button5" onclick="let el = document.getElementById('circle'); el.style.display = 'none'; drawingToggle = false;"></button>

    <canvas id="canvas" width="1000" height="1000"></canvas>






<script>
//BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE!

const canvas = document.getElementById('canvas');

const ctx = canvas.getContext('2d');

const brushImg = new Image();

brushImg.src = 'images/circle.png';

let isLoaded = false;

brushImg.onload = () => {

isLoaded = true;

}

let isDrawing = false;
let lastX = 0;
let lastY = 0;

function stampBrush(x,y){

if(!isLoaded) return;

const size = 32;

const drawX = x - size / 2;
const drawY = y - size / 2;

ctx.drawImage(brushImg, drawX, drawY, size, size);
}

function getDistance(x0, y0, x1, y1){

const dx = x1 - x0;
const dy = y1 - y0;
return Math.sqrt(dx * dx + dy * dy);


}

function drawLine(x0, y0, x1, y1){


const dist = getDistance(x0, y0, x1, y1);

const steps = Math.max(Math.ceil(dist), 1);

for (let i = 0; i <= steps; i++) {

const t = i / steps;
const x = x0 + (x1 - x0) * t;
const y = y0 + (y1 - y0) * t;
stampBrush(x, y);

}
}


    // POINTER DOWN SO IT DRAWS
    canvas.addEventListener('pointerdown', (e) => {
      if(!drawingToggle) return;

      isDrawing = true;
      lastX = e.offsetX;
      lastY = e.offsetY;
      ctx.globalCompositeOperation = 'source-over';
      stampBrush(lastX, lastY);


      
      if(erasingToggle){
      ctx.globalCompositeOperation = 'destination-out';
      }
    });





canvas.addEventListener('pointermove',(e) =>{


if (!isDrawing) return;
drawLine(lastX, lastY, e.offsetX, e.offsetY);
lastX = e.offsetX;
lastY = e.offsetY;


});




window.addEventListener('pointerup', () => {
  isDrawing = false;
});

//BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE! BRUSH CODE!
</script>
