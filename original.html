        /* LONG RECTANGLE - BACKGROUND ELEMENT */
        .custom-image1 {
            position: absolute;
            top: 0px;       /* Distance from the top */
            left: 0px;      /* Distance from the side */
            width: auto;     /* Size */
            height: 1080px;     /* Size */
            pointer-events: none; /* Stops all clicks, touches, and interactions */
            user-select: none;    /* Prevents any accidental text/element highlighting */
        }
    </style>

    <style>

      /* ROUNDED SQUARE */
      .custom-button1 {
        position: absolute;
          top: 10px;
          left: -8px;
          width: 100px;
          height: 100px;           
          font-size: 16px;          
          border: none;              /* Removes the default ugly border */
          border-radius: 20px;        /* Slightly rounds the corners */
          cursor: pointer;           /* Changes the mouse cursor to a pointer on hover */
          background-image: url("images/rounded_square.png");
          background-position: center;
          background-size: 145px 145px;
      }
    </style>
