<!DOCTYPE html>
<html>



<head> <!-- HEAD IS INTERNAL SYSTEMS -->
    <title>My Web Page</title>

    <style>


        /* LONG RECTANGLE - BACKGROUND ELEMENT */
        .rectangle {
            position: absolute;
            top: 0px;       
            left: 0px;      
            width: 1700px;  
            height: 1050px; 
            pointer-events: none; 
            user-select: none;    
        }
    </style>

    <style>

      /* ROUNDED SQUARE */
      .custom-button1 {
        position: absolute;
          top: 10px;
          left: 10px;
          width: 80px;
          height: 80px;           
          font-size: 16px;          
          border: none;              
          border-radius: 15px;       
          cursor: pointer;           
          background-image: url("images/rounded_square.png");
          background-position: center;
          background-size: 115px 115px;
          transition: 0.2s ease;
      }
          .custom-button1:active {
           filter: brightness(0.75);
           transition: none;        
      }
      
    </style>

    
    <style>
    .circle {
      position: absolute;
      top: 50px;
      left: 50px; /* Kellin was here!!!!!!!!!!!!!!!!!!! */
      width: 50px;
      height: auto;
      pointer-events: none; /* Allows for clicking the element underneath */
      transform: translate(-50%, -50%); /* Centers element on cursor point */
      transition: 0.05s ease-out; /* Smooths out fast movements */


    }
    </style>

    <style>

      /* ROUNDED SQUARE 2 */
      .custom-button2 {
        position: absolute;
          top: 110px;
          left: 10px;
          width: 80px;
          height: 80px;           
          font-size: 16px;          
          border: none;              
          border-radius: 15px;       
          cursor: pointer;           
          background-image: url("images/rounded_square.png");
          background-position: center;
          background-size: 115px 115px;
          transition: 0.2s ease;
      }

          .custom-button2:active {
           filter: brightness(0.75); 
           transition: none;        
      }
    </style>


    <style>

      /* ROUNDED SQUARE 3 */
      .custom-button3 {
        position: absolute;
          top: 210px;
          left: 10px;
          width: 80px;
          height: 80px;           
          font-size: 16px;          
          border: none;             
          border-radius: 15px;      
          cursor: pointer;          
          background-image: url("images/rounded_square.png");
          background-position: center;
          background-size: 115px 115px;
          transition: 0.2s ease;
      }

      .custom-button3:active {
         filter: brightness(0.75); 
         transition: none;        
      }
    </style>



    <style>

      /* ROUNDED SQUARE 4 */
      .custom-button4 {
        position: absolute;
          top: 310px;
          left: 10px;
          width: 80px;
          height: 80px;           
          font-size: 16px;          
          border: none;              
          border-radius: 15px;       
          cursor: pointer;           
          background-image: url("images/rounded_square.png");
          background-position: center;
          background-size: 115px 115px;
          transition: 0.2s ease;
      }
      .custom-button4:active {
        filter: brightness(0.75); 
        transition: none;        
      }
    </style>



    <style>

      /* ROUNDED SQUARE 5 */
      .custom-button5 {
        position: absolute;
          top: 410px;
          left: 10px;
          width: 80px;
          height: 80px;           
          font-size: 16px;          
          border: none;              
          border-radius: 15px;       
          cursor: pointer;           
          background-image: url("images/rounded_square.png");
          background-position: center;
          background-size: 115px 115px;
          transition: 0.2s ease;
      }
      .custom-button5:active {
          filter: brightness(0.75); 
         transition: none;        
      }



      #canvas {
        display: grid;
        grid-template-columns: repeat(1000, 1px); /* 16 columns, each 20px wide */
        grid-template-rows: repeat(1000, 1px);    /* 16 rows, each 20px tall */
        background-color: #ccc;                  /* Grid line color */
      }

      .pixel {
        background-color: #fff;                  /* Default pixel color */
        cursor: pointer;
      }

      
   
   </style>



</head>




<body> <!-- BODY IS VISUAL COMPONENTS -->







  
    
    <!-- 'custom-image' class so CSS applies to this image -->
    <img src="/images/long_rectangle.png" alt="long :)" class="rectangle">

    <button class="custom-button1" onclick="let el = document.getElementById('circle'); el.style.display = (el.style.display === 'none') ? 'block' : 'none';"></button> <!-- Uses JavaScript to hide the circle -->>

    <img src="images/circle.png" alt="circle :)" class="circle" id="circle">

    <button class="custom-button2"></button>

    <button class="custom-button3"></button>

    <button class="custom-button4"></button>

    <button class="custom-button5"></button>

    <div id="canvas"></div>


    <script>

    const canvas = document.getElementById('canvas');

    // Create a 16x16 grid (256 pixels)
    for (let i = 0; i < 1000000; i++) {
      const pixel = document.createElement('div');
      pixel.classList.add('pixel');
      
      // Change color to black when clicked
      pixel.addEventListener('click', () => {
        pixel.style.backgroundColor = 'black';
      });
    
      canvas.appendChild(pixel);
    }


  </script>



  </body>
</html>
