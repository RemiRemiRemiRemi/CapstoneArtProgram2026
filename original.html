<!DOCTYPE html>

    <title>My Web Page</title>

    <style>












        /* LONG RECTANGLE - BACKGROUND ELEMENT */
        .custom-image1 {
            position: absolute;
            top: 0px;       
            left: 0px;      
            width: 1700px;  
            height: 1050px; 
            pointer-events: none; 
            user-select: none;    
        }
    </style>

    <style>

      /* ROUNDED SQUARE */
      .custom-button1 {
        position: absolute;
          top: 10px;
          left: 10px;
          width: 80px;
          height: 80px;           
          font-size: 16px;          
          border: none;              
          border-radius: 15px;       
          cursor: pointer;           
          background-image: url("images/rounded_square.png");
          background-position: center;
          background-size: 115px 115px;
          transition: filter 0.2s ease;
      }
          .custom-button1:active {
           filter: brightness(0.75);
           transition: none;        
      }
      
    </style>
